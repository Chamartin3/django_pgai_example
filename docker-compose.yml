name: pgai-example
services:
  db:
    image: timescale/timescaledb-ha:pg17
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pg-data:/home/postgres/pgdata/data
    ports:
      - "5432:5432"
    command: ["-c", "ai.ollama_host=http://ollama-query:11434"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  vectorizer-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.vectorizer
    image: timescale/pgai-vectorizer-worker:0.11.4
    env_file:
      - .env
    environment:
      - PGAI_VECTORIZER_WORKER_DB_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
      - DATABASE_HOST=postgres://db:${DB_PORT}
      - OLLAMA_HOST=http://ollama-worker:11434
    command: ["--poll-interval", "5s", "--log-level", "DEBUG"]
    depends_on:
      - db
      - ollama-worker

  # Dedicated Ollama for background vectorizer worker (bulk embedding)
  ollama-worker:
    image: ollama/ollama
    volumes:
      - ${OLLAMA_MODELS_PATH:-ollama-worker-models}:/root/.ollama/models

  # Dedicated Ollama for query-time embeddings (search, annotate, rank)
  ollama-query:
    image: ollama/ollama
    volumes:
      - ${OLLAMA_MODELS_PATH:-ollama-query-models}:/root/.ollama/models

  django:
    build:
      context: .
      dockerfile: docker/Dockerfile.python_uv
    working_dir: /src
    command: ["bash", "-c", "uv sync && uv run python manage.py runserver 0.0.0.0:8000"]
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - OLLAMA_HOST=http://ollama-query:11434
      - DJANGO_SETTINGS_MODULE=settings
    volumes:
      - .:/src
      - ${DJANGO_PGAI_PATH}:/opt/django_pgai
      - uv-cache:/root/.cache/uv
      - uv-venv:/src/.venv
    ports:
      - "8080:8000"
      - "8888:8888"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg-data:
    driver: local
  uv-cache:
    driver: local
  uv-venv:
    driver: local
  ollama-worker-models:
    driver: local
  ollama-query-models:
    driver: local
