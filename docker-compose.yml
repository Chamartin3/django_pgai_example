name: pgai-example
services:
  db:
    image: timescale/timescaledb-ha:pg17
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pg-data:/home/postgres/pgdata/data
    ports:
      - "5432:5432"
    command: ["-c", "ai.ollama_host=http://ollama-pgai:11434"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  vectorizer-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.vectorizer
    image: timescale/pgai-vectorizer-worker:0.11.4
    env_file:
      - .env
    environment:
      - PGAI_VECTORIZER_WORKER_DB_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
      - DATABASE_HOST=postgres://db:${DB_PORT}
      - OLLAMA_HOST=http://ollama-pgai:11434
    command: ["--poll-interval", "5s", "--log-level", "DEBUG"]
    depends_on:
      - db
      - ollama-pgai

  ollama-pgai:
    image: ollama/ollama
    volumes:
      - ${OLLAMA_MODELS_PATH}:/root/.ollama/models

  django:
    build:
      context: .
      dockerfile: docker/Dockerfile.python_uv
    working_dir: /src
    command: ["bash", "-c", "uv sync && uv run python manage.py runserver 0.0.0.0:8000"]
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - OLLAMA_HOST=http://ollama-pgai:11434
      - DJANGO_SETTINGS_MODULE=settings
    volumes:
      - .:/src
      - ${DJANGO_PGAI_PATH}:/opt/django_pgai:ro
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg-data:
    driver: local
